name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck & test (Bun + Turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Typecheck (turbo)
        run: bunx turbo run typecheck --filter=backend

      - name: Test (turbo)
        run: bunx turbo run test --filter=backend

  frontend:
    name: Frontend — build (Bun + Turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile

      - name: Build (turbo)
        run: bunx turbo run build --filter=frontend

  docker:
    name: Docker — build & compose validation
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: merb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  smoke-test:
    name: Docker Compose — full stack smoke test
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API is healthy"; exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Smoke test register & login
        run: |
          REGISTER=$(curl -sf -X POST http://localhost:3000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"Smoke Test","email":"smoke@test.dev","password":"Password123"}')
          echo "$REGISTER"
          TOKEN=$(echo "$REGISTER" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          test -n "$TOKEN" || { echo "No access token returned"; exit 1; }

          curl -sf http://localhost:3000/api/v1/auth/me \
            -H "Authorization: Bearer $TOKEN"

          LOGIN=$(curl -sf -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@example.com","password":"Admin123!"}')
          echo "$LOGIN" | grep -q "accessToken"

      - name: Teardown
        if: always()
        run: docker compose down -v
